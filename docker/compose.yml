name: cirtesu-zed

# ── GPU/ZED services ──────────────────────────────────────────
x-zed-common: &zed-common
  gpus: all
  privileged: true
  shm_size: '2gb'
  ipc: host
  network_mode: host
  stdin_open: true
  tty: true
  environment:
    DISPLAY: ${DISPLAY:-:0}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    __NV_PRIME_RENDER_OFFLOAD: 1
    __GLX_VENDOR_LIBRARY_NAME: nvidia
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev:/dev
    - /dev/shm:/dev/shm
    - /usr/local/zed/resources:/usr/local/zed/resources
    - /usr/local/zed/settings:/usr/local/zed/settings
    - ../:/workspace
    - ../data/calibration:/calibration
    - ../data/captures:/captures
    - ../data/rosbags:/rosbags
    - ../config:/config:ro

# ── Pure ROS 2 services ───────────────────────────────────────
x-ros-common: &ros-common
  network_mode: host
  shm_size: '2gb'
  ipc: host
  stdin_open: true
  tty: true
  environment:
    DISPLAY: ${DISPLAY:-:0}

services:
  # Profile: ros2
  # Pure ROS 2 Humble dev environment. No ZED SDK.
  # Add packages here as your project grows.
  ros2:
    <<: *ros-common
    build:
      context: /home/diego/Documents/Development/docker/base/humble-desktop
      dockerfile: Dockerfile
    image: ros2-humble:humble
    container_name: ros2-humble
    profiles: ["ros2"]

  ## Profile: zed
  ## ZED SDK base. Use for quick SDK tests or as build reference.
  zed:
    <<: *zed-common
    build:
      context: ..
      dockerfile: docker/base-zed/Dockerfile
    image: zed:humble
    container_name: zed
    profiles: ["zed"]

  # Profile: calib
  # Main working image: ZED SDK + ROS 2 Humble + calibration binary (pre-built).
  # No build tools at runtime.
  zed-ros2-calib:
    <<: *zed-common
    build:
      context: ..
      dockerfile: docker/zed-ros2-calib/Dockerfile
    image: zed-ros2-calib:2026-02
    container_name: zed-ros2-calib
    working_dir: /workspace/external/zed-opencv-calibration
    environment:
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: 1
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      ZED_SDK_SVO_VERSION: ${ZED_SDK_SVO_VERSION:-1}
      PYTHONNOUSERSITE: "1"
    profiles: ["calib"]
